<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#b8405a"/>
      <stop offset="0.5" stop-color="#7d2135"/>
      <stop offset="1" stop-color="#3f0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff9fb2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9fb2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a0509" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0509" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
