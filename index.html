<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Las cenas del mes, la compra y el congelador, día a día.">
<meta name="theme-color" content="#fcfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tuppers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light dark;box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{overscroll-behavior-y:none}</style>
<title>Tuppers del mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tuppers del mes · app de uso diario. Sistema porcelana + burdeos: cada color tiene un trabajo.
   burdeos = el tiempo (hoy, lo que haces tú) · escarcha = congelador · arcilla = despensa
   oliva = fresco · piedra = cocina otro · pimentón = solo seguridad · lo hecho, en tinta.
   Estructura: cabecera fija con la fecha, cinco pantallas (Hoy, Mes, Compra, Congelador, Platos) y barra de pestañas abajo. */
:root{
  --porcelana:#f4f1ee; --superficie:#fcfbf9; --hundido:#ebe6e1; --linea:#ddd6cf; --linea-suave:#e8e2dc;
  --tinta:#1d171b; --tinta-2:#5c5257; --tinta-3:#71666b;
  --banda:#4a1522; --banda-2:#6e2232; --sobre-banda:#f8eeee; --banda-tenue:#dcb0b8;
  --burdeos:#7a1f30; --burdeos-suave:#f3e2e3; --sobre-burdeos:#ffffff;
  --escarcha:#35566f; --escarcha-suave:#e3eaef;
  --arcilla:#8a5232; --arcilla-suave:#f3e6dd;
  --oliva:#53602a; --oliva-suave:#e9ebd8;
  --piedra:#e6e0d9;
  --pimenton:#b0481c; --pimenton-suave:#f8e6da;
  --sombra:0 18px 48px rgba(29,23,27,.16);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-l:24px; --r-s:8px; --tab:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --porcelana:#131012; --superficie:#1b171a; --hundido:#252024; --linea:#342d32; --linea-suave:#2a2428;
  --tinta:#f0eaec; --tinta-2:#b4a9ae; --tinta-3:#94898e;
  --banda:#3a111c; --banda-2:#5e1f2e; --sobre-banda:#f8eeee; --banda-tenue:#d4a3ab;
  --burdeos:#eba3ae; --burdeos-suave:#3a1a20; --sobre-burdeos:#1c0d10;
  --escarcha:#a3c0d6; --escarcha-suave:#1b262e;
  --arcilla:#dfa57f; --arcilla-suave:#2e2119;
  --oliva:#bfca88; --oliva-suave:#232716;
  --piedra:#2c2724;
  --pimenton:#f29a68; --pimenton-suave:#35200f;
  --sombra:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --porcelana:#131012; --superficie:#1b171a; --hundido:#252024; --linea:#342d32; --linea-suave:#2a2428;
  --tinta:#f0eaec; --tinta-2:#b4a9ae; --tinta-3:#94898e;
  --banda:#3a111c; --banda-2:#5e1f2e; --sobre-banda:#f8eeee; --banda-tenue:#d4a3ab;
  --burdeos:#eba3ae; --burdeos-suave:#3a1a20; --sobre-burdeos:#1c0d10;
  --escarcha:#a3c0d6; --escarcha-suave:#1b262e;
  --arcilla:#dfa57f; --arcilla-suave:#2e2119;
  --oliva:#bfca88; --oliva-suave:#232716;
  --piedra:#2c2724;
  --pimenton:#f29a68; --pimenton-suave:#35200f;
  --sombra:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--porcelana)}
body{color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--superficie)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.lab{font-family:var(--mono);font-size:11px;line-height:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
:is(button,a,input,label,[tabindex]):focus-visible{outline:2px solid var(--burdeos);outline-offset:2px;border-radius:var(--r-s)}
[hidden]{display:none!important}

/* ---------- cabecera ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--superficie);border-bottom:1px solid var(--linea)}
.hd{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--banda);color:var(--sobre-banda);display:grid;place-items:center;flex:0 0 34px;font-family:var(--display);font-style:italic;font-size:20px;padding-bottom:2px}
.hd h1{font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.hd .sub{font-family:var(--display);font-style:italic;font-size:14px;color:var(--tinta-3)}
.hd .back{margin-left:auto;appearance:none;border:0;background:var(--burdeos-suave);color:var(--burdeos);font-weight:700;font-size:13px;height:32px;padding:0 12px;border-radius:999px}
main{padding-block:16px 8px}
.view{display:grid;gap:14px}
.vt{font-family:var(--display);font-size:28px;font-weight:400;letter-spacing:-.02em;line-height:1.1}
.vs{font-family:var(--display);font-style:italic;font-size:16px;color:var(--tinta-2);margin-top:2px}

/* ---------- barra de pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--superficie) 94%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-top:1px solid var(--linea);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
.tab{appearance:none;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tinta-3);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--burdeos)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2.5px;border-radius:0 0 3px 3px;background:var(--burdeos)}
.tab .bd{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--burdeos);color:var(--sobre-burdeos);font-family:var(--mono);font-size:10px;line-height:17px;border:2px solid var(--superficie);box-sizing:content-box}

/* ---------- tira de días ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dp{appearance:none;flex:0 0 48px;border:0;border-radius:14px;padding:8px 0 9px;background:var(--superficie);display:grid;justify-items:center;gap:3px;scroll-snap-align:center;box-shadow:inset 0 0 0 1px var(--linea-suave)}
.dp .w{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}
.dp .n{font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.dp i{width:6px;height:6px;border-radius:50%;background:transparent}
.dp.t-cena i,.dp.t-comida i{background:var(--burdeos)} .dp.t-dan i,.dp.t-bcn i{background:var(--tinta-3);opacity:.5}
.dp.hoy .n{color:var(--burdeos)}
.dp.sel{background:var(--banda);box-shadow:none}
.dp.sel .w,.dp.sel .n{color:var(--sobre-banda)} .dp.sel i{background:var(--sobre-banda)}
.dp.past:not(.sel){opacity:.55}

/* ---------- héroe del día ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:20px;color:var(--sobre-banda);background:linear-gradient(135deg,var(--banda-2) 0%,var(--banda) 64%);display:grid;gap:10px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid var(--banda-tenue);opacity:.22;pointer-events:none}
.hero .lab{color:var(--banda-tenue)}
.hero h2{font-family:var(--display);font-size:clamp(26px,7vw,32px);font-weight:400;letter-spacing:-.02em;line-height:1.12;font-variation-settings:'opsz' 96;max-width:20ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hero .chip{background:rgba(248,238,238,.12);color:var(--sobre-banda)}
.hero .nota{font-size:14px;color:var(--sobre-banda);opacity:.85;max-width:52ch}
.hero .go{justify-self:start;appearance:none;border:0;background:var(--sobre-banda);color:var(--banda);font-weight:700;font-size:14px;height:40px;padding:0 18px;border-radius:999px}
.hero.calm{background:var(--piedra);color:var(--tinta)}
.hero.calm::after{border-color:var(--linea)}
.hero.calm .lab{color:var(--tinta-3)} .hero.calm .nota{color:var(--tinta-2);opacity:1}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip svg{width:14px;height:14px;flex:0 0 14px;margin-left:-2px}
.c-f{background:var(--escarcha-suave);color:var(--escarcha)} .c-d{background:var(--arcilla-suave);color:var(--arcilla)}
.c-n{background:var(--oliva-suave);color:var(--oliva)} .c-m{background:var(--burdeos-suave);color:var(--burdeos)}
.c-t{background:transparent;color:var(--tinta-2);box-shadow:inset 0 0 0 1px var(--linea);font-family:var(--mono);font-weight:500;font-size:11.5px}

/* ---------- tarjetas y tareas ---------- */
.card{background:var(--superficie);border:1px solid var(--linea-suave);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch h3{font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:-.01em}
.ch .ct{font-family:var(--mono);font-size:12px;color:var(--tinta-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--hundido);overflow:hidden}
.bar i{display:block;height:100%;background:var(--burdeos);border-radius:99px;transition:width .25s}
.tasks{display:grid}
.tk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 2px;border-top:1px solid var(--linea-suave);cursor:pointer}
.tk:first-child{border-top:0;padding-top:4px}
.tk input{appearance:none;width:22px;height:22px;margin:0;border:1.5px solid var(--linea);border-radius:50%;display:grid;place-items:center;background:var(--superficie);cursor:pointer;transition:background .2s,border-color .2s}
.tk input:checked{background:var(--tinta);border-color:var(--tinta)}
.tk input:checked::after{content:"";width:5px;height:10px;border:solid var(--superficie);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tk .tt{font-weight:600;line-height:1.35}
.tk .td{display:block;font-size:13px;color:var(--tinta-2);margin-top:2px}
.tk.done .tt{color:var(--tinta-3);text-decoration:line-through;text-decoration-thickness:1px}
.tk.done .td{color:var(--tinta-3)}
.tk .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:center}
.k-f{background:var(--escarcha-suave);color:var(--escarcha)} .k-m{background:var(--burdeos-suave);color:var(--burdeos)} .k-n{background:var(--oliva-suave);color:var(--oliva)}
.tk.link{cursor:pointer}
.tk .arr{color:var(--tinta-3);font-size:20px;line-height:1;align-self:center}
.tk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--burdeos-suave);color:var(--burdeos)}
.tk .ic svg{width:13px;height:13px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
.next .dd{font-family:var(--display);font-size:28px;line-height:1;text-align:center;min-width:40px}
.next .dd small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);margin-top:3px}
.next b{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.25;display:block}
.next span{font-size:13px;color:var(--tinta-3)}
.empty{font-size:14px;color:var(--tinta-2)}

/* sesión dentro de Hoy */
.steps{display:grid}
.st{display:grid;grid-template-columns:42px 22px minmax(0,1fr);gap:10px;padding:12px 0;cursor:pointer;position:relative}
.st::before{content:"";position:absolute;left:62px;top:36px;bottom:-12px;width:1px;background:var(--linea)}
.st:last-child::before{display:none}
.st .h{font-family:var(--mono);font-size:12.5px;color:var(--burdeos);padding-top:2px;font-variant-numeric:tabular-nums}
.st input{appearance:none;width:22px;height:22px;margin:0;border:1.5px solid var(--linea);border-radius:50%;display:grid;place-items:center;background:var(--superficie);position:relative;z-index:1;cursor:pointer}
.st input:checked{background:var(--tinta);border-color:var(--tinta)}
.st input:checked::after{content:"";width:5px;height:10px;border:solid var(--superficie);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.st.now input{border-color:var(--burdeos);box-shadow:0 0 0 4px var(--burdeos-suave)}
.st .w{font-weight:600}
.st .x{display:block;font-size:13.5px;color:var(--tinta-2);margin-top:2px}
.st.done .w,.st.done .x{color:var(--tinta-3)}

/* ---------- mes ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--tinta-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--linea)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hdr{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--tinta-3);text-align:center;padding:2px 0 6px}
.cell{appearance:none;border:1.5px solid transparent;border-radius:10px;padding:6px 5px 7px;min-height:62px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;background:transparent;font-size:11px;line-height:1.2}
.cell .n{font-family:var(--mono);font-size:12px;color:var(--tinta-3)}
.cell .l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.t-cena{background:var(--burdeos-suave)}
.cell.t-comida{background:linear-gradient(180deg,var(--superficie) 0 46%,var(--burdeos-suave) 46%);border-color:var(--burdeos-suave)}
.cell.t-dan,.cell.t-bcn{background:var(--piedra);color:var(--tinta-2)}
.cell.t-nada{border:1.5px dashed var(--linea);color:var(--tinta-3)}
.cell.off{opacity:.45;cursor:default}
.cell.hoy{border-color:var(--burdeos)!important} .cell.hoy .n{color:var(--burdeos)}
.cell .sh{display:block;width:6px;height:6px;border-radius:50%;background:var(--escarcha);margin-top:auto}
.cell .cp{display:block;width:6px;height:6px;border-radius:2px;background:var(--oliva);margin-top:auto}
@media (max-width:400px){.cell{min-height:54px;padding:5px 3px}.cell .l{font-size:9.5px}}
.list{display:grid}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--linea-suave);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .dd{font-family:var(--display);font-size:24px;line-height:1;text-align:center}
.row .dd small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);margin-top:3px}
.row b{display:block;font-weight:600;line-height:1.3}
.row span.s{display:block;font-size:12.5px;color:var(--escarcha);margin-top:2px;font-weight:600}
.row span.e{display:block;font-size:12.5px;color:var(--tinta-3)}
.row .m{font-family:var(--mono);font-size:12px;color:var(--tinta-3)}
.row.otro b{color:var(--tinta-2);font-weight:500}
.row.hoy .dd{color:var(--burdeos)}
.row.past{opacity:.5}
.wkh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);padding:14px 0 4px}

/* ---------- compra ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--hundido);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tinta-2)}
.seg button[aria-pressed="true"]{background:var(--superficie);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.shop{background:var(--superficie);border:1px solid var(--linea-suave);border-radius:var(--r);overflow:hidden}
.shop.fresh{background:var(--oliva-suave);border-color:transparent}
.shop.urg{border:1.5px solid var(--burdeos)}
.sh-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 16px 10px}
.sh-h h3{font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.sh-h small{display:block;font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.sh-h .ct{font-family:var(--mono);font-size:12px;color:var(--tinta-3)}
.wst{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;vertical-align:3px;background:var(--superficie);color:var(--oliva)}
.wst.hoy{background:var(--burdeos);color:var(--sobre-burdeos)}
.it{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 16px;border-top:1px solid var(--linea-suave);cursor:pointer}
.fresh .it{border-top-color:var(--linea)}
.it input{appearance:none;width:22px;height:22px;margin:0;border:1.5px solid var(--linea);border-radius:7px;display:grid;place-items:center;background:var(--superficie);cursor:pointer}
.it input:checked{background:var(--tinta);border-color:var(--tinta)}
.it input:checked::after{content:"";width:5px;height:10px;border:solid var(--superficie);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .w{font-weight:600}
.it .d{display:block;font-size:13px;color:var(--tinta-3);margin-top:1px}
.it .q{font-family:var(--mono);font-size:12.5px;color:var(--tinta-2);white-space:nowrap;text-align:right}
.it.done .w{color:var(--tinta-3);text-decoration:line-through}
.cart{border-top:1px solid var(--linea-suave)}
.fresh .cart{border-top-color:var(--linea)}
.cart summary{list-style:none;cursor:pointer;padding:11px 16px;font-size:13px;font-weight:600;color:var(--tinta-3)}
.cart summary::-webkit-details-marker{display:none}
.cart summary::after{content:" ›"} .cart[open] summary::after{content:" ⌄"}
.done-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.done-h::-webkit-details-marker{display:none}

/* ============ PANTALLA COMPRA ============ */
let compraTab='pend';
function itHTML(it){const [id,w,dd,q,p]=it,on=!!ST.cs[id];
  return `<label class="it ${on?'done':''}"><input type="checkbox" data-c="${id}" ${on?'checked':''} aria-label="${esc(w)}"><span><span class="w">${esc(w)}</span>${dd||p?`<span class="d">${esc([dd,p].filter(Boolean).join(' · '))}</span>`:''}</span><span class="q">${esc(q)}</span></label>`}
function grupoHTML(g){const P=g.items.filter(x=>!ST.cs[x[0]]),C=g.items.filter(x=>ST.cs[x[0]]);
  const st=!fuera&&HOY===g.d?'<span class="wst hoy">Hoy</span>':!fuera&&g.d===proxCompra()?'<span class="wst">La próxima</span>':'';
  if(!P.length)return `<details class="shop ${g.fresh?'fresh':''}"><summary class="done-h"><b>${esc(fecha(g.d))} · ${esc(g.t)}</b><span>✓ ${g.items.length} de ${g.items.length}</span></summary>${C.map(itHTML).join('')}</details>`;
  return `<div class="shop ${g.fresh?'fresh':''} ${g.urg&&HOY<=g.d?'urg':''}"><div class="sh-h"><div><h3>${esc(fecha(g.d))} · ${esc(g.t)}${st}</h3><small>${esc(g.sub)}</small></div><span class="ct">${C.length}/${g.items.length}</span></div>
    ${P.map(itHTML).join('')}${C.length?`<details class="cart"><summary>Hecho (${C.length})</summary>${C.map(itHTML).join('')}</details>`:''}</div>`}
const proxCompra=()=>{const g=COMPRAS.find(g=>!g.casa&&g.d>=HOY&&pend(g).length);return g?g.d:null};
function vCompra(){const pendientes=COMPRAS.filter(g=>pend(g).length),hechas=COMPRAS.filter(g=>!pend(g).length);
  const sumP=COMPRAS.filter(g=>!g.casa).reduce((a,g)=>a+pend(g).length,0);
  const top=`<div><h2 class="vt">Compra</h2><p class="vs">${sumP?sumP+' cosas por comprar este mes':'Todo comprado'}</p></div>
   <div class="seg" role="group" aria-label="Qué ver"><button data-ct="pend" aria-pressed="${compraTab==='pend'}">Pendiente</button><button data-ct="tick" aria-pressed="${compraTab==='tick'}">Ticket del 4</button></div><p class="note">${DB?'Lo que marcas se sincroniza entre tus dispositivos.':'Lo que marcas se guarda solo en este dispositivo.'}</p>`;
  let body;
  if(compraTab==='pend'){
    body=pendientes.map(grupoHTML).join('')+(hechas.length?`<p class="lab" style="padding:6px 2px 0">Hecho</p>`+hechas.map(grupoHTML).join(''):'')+
     `<details class="shop"><summary class="done-h"><b>Básicos, solo si te falta</b><span style="color:var(--tinta-3)">${BASICOS.length}</span></summary><div class="tl">${BASICOS.map(([a,b])=>`<div><span>${esc(a)}${b?`<small>${esc(b)}</small>`:''}</span><span></span></div>`).join('')}</div></details>`+
     `<div class="card"><div class="ch"><h3>Cuánto cuesta</h3></div><div class="tot">
       <div><span>Ticket del día 4</span><b>78,83 €</b></div><div><span>Jue 5 · antes de la sesión</span><b>~5,5 €</b></div><div><span>Sáb 7 · fresco y lo que faltó</span><b>~11 €</b></div>
       <div><span>Mié 18 · al volver</span><b>~4,5 €</b></div><div><span>Lun 23 · última semana</span><b>~4,3 €</b></div><div class="big"><span>Noviembre</span><b>~104 €</b></div></div>
       <p class="note">Incluye 14 € del ticket que no son del plan (guayaba, café, Nestea, barbacoa y bayetas). Las cenas del mes salen por unos 90 €.</p></div>`}
  else body=`<div class="shop"><div class="sh-h"><div><h3>Carrefour · mié 4</h3><small>29 artículos · lo que es para el plan</small></div><span class="ct">78,83 €</span></div><div class="tl">${TICKET.map(([a,b,c])=>`<div><span>${esc(a)}<small>${esc(b)}</small></span><span>${c} €</span></div>`).join('')}</div></div>
    <div class="shop"><div class="sh-h"><div><h3>Fuera del plan</h3><small>Bien comprado, pero no cuenta para las cenas</small></div><span class="ct">14 €</span></div><div class="tl">${EXTRAS.map(([a,c])=>`<div class="x"><span>${esc(a)}</span><span>${c} €</span></div>`).join('')}</div></div>
    <div class="card"><div class="ch"><h3>Lo que cambia</h3></div><p class="note" style="color:var(--tinta-2)">Hamburguesas de lomo en vez de ternera para los jueves (hazlas bien por dentro). Queso Bredam en vez de mozzarella y parmesano: vale para la pizza y para gratinar. El paquete extra de hamburguesas de pollo queda de reserva en el congelador.</p></div>`;
  $('#v-compra').innerHTML=top+body}

/* ============ PANTALLA CONGELADOR ============ */
function vFrio(){const d=SEL,B=enFrio(d),noche=sacaNoche(d),hoyS=sacaHoy(d);
  const cuenta=c=>B.filter(b=>b.cj===c).length;
  const grupos=c=>{const m={};B.filter(b=>b.cj===c).forEach(b=>{(m[b.q]=m[b.q]||[]).push(b)});return Object.entries(m)};
  const drw=c=>{const G=grupos(c);return `<div class="drw"><div class="drw-h"><b>${CAJON[c]}</b><span>${cuenta(c)}</span></div>${G.length?G.map(([q,L])=>{const us=L.map(b=>b.uso).filter(u=>u!=null).sort((a,b)=>a-b),pronto=L.some(b=>b.sacar===d&&b.uso!==d),hoyU=L.some(b=>b.sacar===d&&b.uso===d);
    return `<div class="fi ${pronto?'soon':''}"><span><b>${esc(q)}</b><small>${pronto?'Sale esta noche · ':hoyU?'Hoy, al llegar · ':''}${us.length?(L[0].congelado?'se usa congelado: ':'para el ')+us.map(u=>fecha(u)).join(', '):'sin fecha: de reserva'}</small></span><span class="qq">${L.length}</span></div>`}).join(''):'<div class="fi"><span><small>Vacío</small></span></div>'}</div>`};
  const out=noche.length||hoyS.length?`<div class="out"><span class="lab">${hoyS.length?(d===HOY&&!fuera?'Hoy':fecha(d)):(d===HOY&&!fuera?'Esta noche':'La noche del '+fecha(d))}</span><b>${hoyS.length?'Al llegar: descongela '+lista(hoyS.map(b=>b.txt))+' en agua fría. ':''}${noche.length?'Saca '+lista(noche.map(b=>b.txt))+'.':''}</b><span style="font-size:13px;opacity:.85">${noche.length?'Del congelador a la nevera, para la cena de mañana.':''}</span></div>`:
    `<div class="card"><p class="empty">${d===HOY&&!fuera?'Esta noche':'Esa noche'} no hay que sacar nada.</p></div>`;
  $('#v-frio').innerHTML=`<div><h2 class="vt">Congelador</h2><p class="vs">${d===HOY&&!fuera?'ahora mismo':'el '+DOWL[wd(d)]+' '+d}</p></div>${out}
   <div class="fz-sum"><div><b>${cuenta(1)}</b><span>hecho</span></div><div><b>${cuenta(2)}</b><span>pescado</span></div><div><b>${cuenta(3)}</b><span>carne y otros</span></div></div>
   ${drw(1)}${drw(2)}${drw(3)}
   <div class="safe"><h3><i>!</i>Para que sea seguro</h3><ul>
    <li>Saca cada cena la <b>noche anterior</b> y déjala en la nevera.</li><li><b>No vuelvas a congelar</b> lo que ya se ha descongelado.</li>
    <li>Si hay que descongelar deprisa: bolsa cerrada en agua fría, cambiando el agua cada 30 min, y a cocinar enseguida.</li>
    <li>Lo cocinado aguanta 2–3 meses; el pescado crudo, 3; la carne cruda, 4–6. Lo del mes llega de sobra.</li><li>Recalienta hasta que esté bien caliente por dentro.</li></ul></div>`}

/* ============ PANTALLA PLATOS ============ */
function vPlatos(){$('#v-platos').innerHTML=`<div><h2 class="vt">Platos</h2><p class="vs">los 8 del mes y cuándo tocan</p></div>`+
  Object.entries(PLATOS).map(([k,P])=>{const ds=PLAN.filter(e=>e[2]===k).map(e=>e[0]);return `<button class="dish" data-dish="${k}"><h3>${esc(P.n)}</h3><span class="when">${ds.map(fecha).join(' · ')}</span>${CANT[k]?`<span class="dq">${esc(CANT[k][0][0])} · ${esc(CANT[k][0][1])}</span>`:''}<div class="meta">${lugares(k)}<span class="chip c-t">${P.min} min</span></div></button>`}).join('')}

/* ============ HOJA DE DETALLE ============ */
function abrirDia(d){const e=dia(d);if(!e)return;const [,t,p,ev,nota]=e,s=sacaTxt(d),c=t==='cena'||t==='comida';
  $('#sheet').innerHTML=`<div class="sheet-in"><div class="grab" aria-hidden="true"></div><div class="sh-top"><div><span class="lab">${esc(DOWL[wd(d)])} ${d}${ev?' · '+esc(ev):''}</span><h2 id="shT">${esc(cenaTxt(e))}</h2></div><button class="xbtn" data-close aria-label="Cerrar">×</button></div>
   ${nota?`<p style="color:var(--tinta-2)">${esc(nota)}</p>`:''}${c?`<div class="btns"><span class="chip c-t">${PLATOS[p].min} min</span>${lugares(p)}</div>${ingHTML(p)}${cantHTML(p)}<ol class="how">${PLATOS[p].how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
   ${s?`<div class="saca">${I.luna}<span>Antes de dormir: ${esc(s.replace(/^Saca/,'saca'))}</span></div>`:''}
   <div class="btns"><button class="btn pri" data-goday="${d}">Ver el día</button>${COMPRAS.some(g=>g.d===d)?'<button class="btn" data-go="compra">Ver la compra</button>':''}</div></div>`;
  hoja(true)}
function abrirPlato(k){const P=PLATOS[k],ds=PLAN.filter(e=>e[2]===k).map(e=>e[0]);
  $('#sheet').innerHTML=`<div class="sheet-in"><div class="grab" aria-hidden="true"></div><div class="sh-top"><div><span class="lab">${ds.map(fecha).join(' · ')}</span><h2 id="shT">${esc(P.n)}</h2></div><button class="xbtn" data-close aria-label="Cerrar">×</button></div>
   <div class="btns"><span class="chip c-t">${P.min} min</span>${lugares(k)}</div>${ingHTML(k)}${cantHTML(k)}<ol class="how">${P.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;hoja(true)}
let ultimoFoco=null;
function hoja(on){const sh=$('#sheet'),sc=$('#scrim');if(on){ultimoFoco=document.activeElement;sh.hidden=false;sc.hidden=false;sh.scrollTop=0;setTimeout(()=>{const x=sh.querySelector('[data-close]');x&&x.focus()},30)}else{sh.hidden=true;sc.hidden=true;ultimoFoco&&ultimoFoco.focus&&ultimoFoco.focus()}}

/* ============ NAVEGACIÓN ============ */
const VISTAS=[['hoy','Hoy',I.hoy],['mes','Mes',I.mes],['compra','Compra',I.bolsa],['frio','Congelador',I.f],['platos','Platos',I.olla]];
function tabs(){const n=COMPRAS.filter(g=>!g.casa&&g.d<=HOY+2).reduce((a,g)=>a+pend(g).length,0);
  $('#tabs').innerHTML=VISTAS.map(([k,t,ic])=>`<button class="tab" data-v="${k}" ${VIEW===k?'aria-current="page"':''}>${ic}<span>${t}</span>${k==='compra'&&n&&!fuera?`<span class="bd">${n}</span>`:''}</button>`).join('')}
function pinta(){vHoy();vMes();vCompra();vFrio();vPlatos();tabs();
  VISTAS.forEach(([k])=>$('#v-'+k).hidden=k!==VIEW);
  $('#toToday').hidden=SEL===HOY||(VIEW!=='hoy'&&VIEW!=='frio');
  $('#hdSub').textContent=fuera?'noviembre':`${DOWL[wd(HOY)]} ${HOY} de noviembre`}
function ir(v,keep){if(!VISTAS.some(x=>x[0]===v))v='hoy';VIEW=v;pinta();if(!keep)window.scrollTo({top:0});
  try{if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v)}catch(e){}}
const ALIAS={sesion:'hoy',noches:'mes',plan:'platos',ya:'hoy'};

document.addEventListener('click',e=>{const t=e.target;
  const tab=t.closest('.tab');if(tab){ir(tab.dataset.v);return}
  const dp=t.closest('[data-d]');if(dp){SEL=+dp.dataset.d;pinta();return}
  const sl=t.closest('[data-sel]');if(sl){SEL=+sl.dataset.sel;ir('hoy');return}
  const op=t.closest('[data-open]');if(op){abrirDia(+op.dataset.open);return}
  const ds=t.closest('[data-dish]');if(ds){abrirPlato(ds.dataset.dish);return}
  const gd=t.closest('[data-goday]');if(gd){SEL=+gd.dataset.goday;hoja(false);ir('hoy');return}
  const go=t.closest('[data-go]');if(go){hoja(false);ir(go.dataset.go);return}
  if(t.closest('[data-sync]')){abrirSync();return}
  const ct=t.closest('[data-ct]');if(ct){compraTab=ct.dataset.ct;vCompra();return}
  if(t.closest('[data-close]')||t===$('#scrim')){hoja(false);return}
  if(t.closest('#toToday')){SEL=HOY;pinta();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)hoja(false);
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const t=e.target,y=window.scrollY;
  if(t.dataset.t){ST.t[t.dataset.t]=t.checked}else if(t.dataset.s!=null){ST.sesion[t.dataset.s]=t.checked}else if(t.dataset.c){ST.cs[t.dataset.c]=t.checked}else return;
  save();pinta();window.scrollTo({top:y})});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(!$('#sheet').hidden)hoja(false);ir(ALIAS[h]||h)});

const h0=location.hash.slice(1);ir(ALIAS[h0]||h0||'hoy',true);
estado('');bajar();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>

</body></html>
